<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Enemy System — Stress Test</title>
<style>
* { margin:0;padding:0;box-sizing:border-box }
body { background:#0a0a12;color:#e0e0e0;font-family:'Courier New',monospace;display:flex;height:100vh;overflow:hidden }
#canvas-wrap { flex:1;position:relative }
#renderCanvas { width:100%;height:100%;display:block }
#hud { position:absolute;top:10px;left:10px;background:rgba(0,0,0,.8);border:1px solid #333;border-radius:8px;padding:12px 16px;font-size:12px;min-width:260px;pointer-events:none }
#hud h2 { color:#7dd3fc;font-size:14px;margin-bottom:8px }
.stat { display:flex;justify-content:space-between;gap:16px;padding:2px 0 }
.stat span:last-child { color:#fbbf24;font-weight:bold }
.ok  { color:#4ade80!important }
.warn{ color:#fb923c!important }
.err { color:#f87171!important }
#log { position:absolute;bottom:10px;left:10px;right:10px;background:rgba(0,0,0,.85);border:1px solid #333;border-radius:6px;padding:8px 12px;font-size:11px;max-height:150px;overflow-y:auto }
.entry{ padding:1px 0;border-bottom:1px solid #1f1f2e }
.entry.ok  { color:#4ade80 }
.entry.warn{ color:#fb923c }
.entry.err { color:#f87171 }
#panel { width:280px;background:#10101a;border-left:1px solid #222;padding:14px;overflow-y:auto }
#panel h3 { color:#7dd3fc;font-size:12px;margin:10px 0 5px;border-bottom:1px solid #222;padding-bottom:3px }
button { width:100%;margin:2px 0;padding:6px 8px;background:#1e293b;border:1px solid #334155;border-radius:4px;color:#e2e8f0;font-size:11px;cursor:pointer;text-align:left }
button:hover { background:#334155 }
button.danger  { border-color:#7f1d1d;color:#fca5a5 }
button.danger:hover  { background:#7f1d1d }
button.success { border-color:#14532d;color:#86efac }
button.success:hover { background:#14532d }
#phase { background:#1e293b;border-radius:5px;padding:8px;margin:6px 0;font-size:11px;color:#94a3b8 }
select { width:100%;padding:4px;background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:4px;font-size:11px;margin-bottom:4px }
</style>
</head>
<body>
<div id="canvas-wrap">
  <canvas id="renderCanvas"></canvas>
  <div id="hud">
    <h2>Enemy Stress Test</h2>
    <div class="stat"><span>Phase</span><span id="s-phase">—</span></div>
    <div class="stat"><span>Active</span><span id="s-active">0</span></div>
    <div class="stat"><span>Pooled</span><span id="s-inactive">0</span></div>
    <div class="stat"><span>Kills</span><span id="s-kills">0</span></div>
    <div class="stat"><span>Double-dmg</span><span id="s-double" class="ok">0</span></div>
    <div class="stat"><span>Leak score</span><span id="s-leak" class="ok">0</span></div>
    <div class="stat"><span>FPS</span><span id="s-fps">—</span></div>
    <div class="stat"><span>Heap MB</span><span id="s-mem">—</span></div>
    <div class="stat"><span>Cache</span><span id="s-cache">0</span></div>
  </div>
  <div id="log"></div>
</div>
<div id="panel">
  <h3>Quick Phases</h3>
  <button class="success" onclick="runPhase('spawn50')">1 Spawn 50 enemies</button>
  <button onclick="runPhase('kill_all')">2 Kill all (recycle)</button>
  <button onclick="runPhase('respawn50')">3 Respawn 50 (pool reuse)</button>
  <button onclick="runPhase('lod_stress')">4 LOD stress (near/far)</button>
  <button onclick="runPhase('zone_switch')">5 Zone switch</button>
  <button onclick="runPhase('unload_map')">6 Unload map</button>
  <button onclick="runPhase('reload_spawn')">7 Reload + re-spawn</button>
  <button class="success" onclick="runPhase('full_cycle')">AUTO: Full cycle</button>
  <h3>Unit Tests</h3>
  <button onclick="testEventLeak()">T1: Event listener leak</button>
  <button onclick="testDoubleDamage()">T2: Double-damage after Tier3</button>
  <button onclick="testDeathRace()">T3: Death + recycle race</button>
  <button onclick="testSpawnRace()">T4: Async spawn race</button>
  <button onclick="testCacheUnload()">T5: Cache unload + pool</button>
  <button onclick="testFlyingY()">T6: Flying enemy Y anchor</button>
  <h3>Manual</h3>
  <select id="eType">
    <option value="big_orc">big_orc</option>
    <option value="big_demon">big_demon</option>
    <option value="blob_mushnub">blob_mushnub</option>
    <option value="flying_armabee">flying_armabee</option>
  </select>
  <button onclick="spawnManual()">Spawn selected</button>
  <button class="danger" onclick="killAll()">Kill all</button>
  <button class="danger" onclick="if(pool){pool.disposeAll();log('Pool disposed','warn')}">Dispose pool</button>
  <h3>Registry</h3>
  <button onclick="scanRegistry()">Scan registry vs GLB</button>
  <div id="phase">Ready. Press a button...</div>
</div>

<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<script src="assets/enemies/enemy-registry.js"></script>
<script src="assets/enemies/enemy-animation.js"></script>
<script src="assets/enemies/enemy-loader.js"></script>
<script src="assets/enemies/enemy-controller.js"></script>
<script src="assets/enemies/enemy-pool.js"></script>
<script src="assets/enemies/enemy-spawn-manager.js"></script>
<script src="assets/enemies/enemy-shadow-manager.js"></script>
<script>
let engine,scene,camera,ground,dirLight,shadowGen;
let pool,spawnMgr,shadowMgr;
let totalKills=0,doubleDamageCount=0,eventLeakScore=0;
let runningPhase=false;

const canvas=document.getElementById('renderCanvas');
engine=new BABYLON.Engine(canvas,true);
scene=new BABYLON.Scene(engine);
scene.clearColor=new BABYLON.Color4(0.05,0.05,0.1,1);
camera=new BABYLON.ArcRotateCamera('cam',-Math.PI/2,Math.PI/3.5,30,BABYLON.Vector3.Zero(),scene);
camera.attachControl(canvas,true);
camera.lowerRadiusLimit=5;camera.upperRadiusLimit=120;
dirLight=new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-1,-2,-1),scene);
dirLight.intensity=1.2;
shadowGen=new BABYLON.ShadowGenerator(1024,dirLight);
shadowGen.useBlurExponentialShadowMap=true;
const amb=new BABYLON.HemisphericLight('amb',BABYLON.Vector3.Up(),scene);
amb.intensity=0.4;
ground=BABYLON.MeshBuilder.CreateGround('ground',{width:200,height:200},scene);
const gMat=new BABYLON.StandardMaterial('gm',scene);
gMat.diffuseColor=new BABYLON.Color3(0.2,0.25,0.2);
ground.material=gMat;ground.checkCollisions=true;ground.receiveShadows=true;

const playerNode={position:new BABYLON.Vector3(0,0,0)};

function initSystems(){
  pool=new EnemyPool(scene,{maxPerType:10,maxTotal:200,debug:false});
  shadowMgr=new EnemyShadowManager(shadowGen,{maxCasters:6,casterRange:25});
  spawnMgr=new EnemySpawnManager(scene,pool,{globalMaxActive:150,debug:false});
  spawnMgr.onEnemyDeath=(ev)=>{totalKills++;shadowMgr.unregisterEnemy(ev.controller);document.getElementById('s-kills').textContent=totalKills};
}
initSystems();

let lastT=performance.now(),fpsA=0,fpsC=0;
engine.runRenderLoop(()=>{
  const now=performance.now();
  const dt=Math.min((now-lastT)/1000,0.1);lastT=now;
  playerNode.position.copyFrom(camera.target);
  spawnMgr.update(dt,camera.target);
  shadowMgr.update(camera.target,dt);
  fpsA+=dt;fpsC++;
  if(fpsA>=0.5){document.getElementById('s-fps').textContent=(fpsC/fpsA).toFixed(0);fpsA=0;fpsC=0}
  const st=pool.getStats();
  document.getElementById('s-active').textContent=st.active;
  document.getElementById('s-inactive').textContent=st.inactive;
  if(performance.memory)document.getElementById('s-mem').textContent=(performance.memory.usedJSHeapSize/1048576).toFixed(1);
  document.getElementById('s-cache').textContent=EnemyLoader.getCacheInfo().totalLoaded;
  scene.render();
});
window.addEventListener('resize',()=>engine.resize());

function log(msg,type='ok'){
  const el=document.getElementById('log');
  const d=document.createElement('div');d.className='entry '+type;
  d.textContent='['+new Date().toLocaleTimeString()+'] '+msg;
  el.prepend(d);if(el.children.length>100)el.lastChild.remove();
  console.log('[ST]',msg);
}
function setPhase(t){document.getElementById('s-phase').textContent=t;document.getElementById('phase').textContent=t}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function rndXZ(r=20){return{x:(Math.random()-.5)*r*2,y:0,z:(Math.random()-.5)*r*2}}

async function spawnEnemy(id,pos,opts={}){
  const ctrl=await pool.spawn(id,{position:pos||rndXZ(15),onDeath:(ev)=>{totalKills++;shadowMgr.unregisterEnemy(ctrl);},...opts});
  if(ctrl){ctrl.setTarget(playerNode);shadowMgr.registerEnemy(ctrl);}
  return ctrl;
}

function killAll(){
  let n=0;
  for(const ctrl of pool.active.values()){if(!ctrl.isDead){ctrl.takeDamage(99999);n++;}}
  log('Kill-all: '+n+' enemies',n>0?'warn':'ok');
}
function spawnManual(){const id=document.getElementById('eType').value;spawnEnemy(id,rndXZ(12)).then(c=>log('Spawned '+id+': '+(c?c.uid.slice(-8):'FAIL')))}

async function runPhase(name){
  if(runningPhase){log('Phase running!','warn');return;}
  runningPhase=true;
  try{await phases[name]();}finally{runningPhase=false;}
}

const phases={
  async spawn50(){
    setPhase('1 Spawning 50...');
    const types=['big_orc','big_demon','blob_mushnub','flying_armabee'];
    for(let i=0;i<50;i++){await spawnEnemy(types[i%types.length],rndXZ(25));if(i%10===9)await sleep(80);}
    log('Spawned 50. Active: '+pool.active.size,'ok');setPhase('1 Done');
  },
  async kill_all(){
    setPhase('2 Killing all...');
    const n=pool.active.size;killAll();
    await sleep(3500);
    log('After 3.5s: active='+pool.active.size+' pooled='+pool.getStats().inactive,'ok');setPhase('2 Done');
  },
  async respawn50(){
    setPhase('3 Respawn 50 (pool reuse)...');
    const was=pool.getStats().inactive;
    const types=['big_orc','big_demon','blob_mushnub','flying_armabee'];
    for(let i=0;i<50;i++)await spawnEnemy(types[i%types.length],rndXZ(25));
    log('Reused ~'+(was-pool.getStats().inactive)+' from pool. Active: '+pool.active.size,'ok');setPhase('3 Done');
  },
  async lod_stress(){
    setPhase('4 LOD stress...');
    const orig=camera.radius;
    for(const d of[4,65,4,65,12,48,4]){camera.radius=d;await sleep(600);log('r='+d+' active='+pool.active.size,'ok');}
    camera.radius=orig;setPhase('4 Done');
  },
  async zone_switch(){
    setPhase('5 Zone switch...');
    spawnMgr.addZone({id:'zt',center:{x:0,z:0},spawnRadius:20,maxActive:5,density:1,respawnDelay:5,enemies:[{id:'big_orc',weight:1}]});
    await sleep(1200);log('Zone active: '+pool.active.size,'ok');
    camera.target.set(300,0,300);await sleep(1500);log('Far: '+pool.active.size,'ok');
    camera.target.set(0,0,0);await sleep(1500);log('Returned: '+pool.active.size,'ok');
    spawnMgr.removeZone('zt');setPhase('5 Done');
  },
  async unload_map(){
    setPhase('6 Unload map...');
    killAll();await sleep(3200);
    pool.disposeAll();EnemyLoader.clearCache([],pool);
    log('Cache: '+EnemyLoader.getCacheInfo().totalLoaded,'ok');setPhase('6 Done');
  },
  async reload_spawn(){
    setPhase('7 Reload...');
    pool=new EnemyPool(scene,{maxPerType:10,maxTotal:200});
    spawnMgr.pool=pool;
    for(let i=0;i<20;i++)await spawnEnemy(['big_orc','blob_mushnub'][i%2],rndXZ(15));
    log('Reloaded. Active: '+pool.active.size,'ok');setPhase('7 Done');
  },
  async full_cycle(){
    log('=== FULL CYCLE START ===','ok');
    for(const k of['spawn50','kill_all','respawn50','lod_stress','zone_switch','unload_map','reload_spawn']){
      await phases[k]();await sleep(400);
    }
    log('=== FULL CYCLE DONE ===','ok');setPhase('FULL CYCLE COMPLETE');
  }
};

async function testEventLeak(){
  log('T1: Event leak test...','ok');
  let hits=0;
  for(let cycle=0;cycle<5;cycle++){
    const ctrl=await pool.spawn('big_orc',{position:{x:0,y:0,z:5},onAttackHit:()=>hits++});
    if(!ctrl)continue;
    ctrl.setTarget(playerNode);
    ctrl.anim&&ctrl.anim.events.emit('onAttackHit',{damage:10});
    ctrl.takeDamage(99999);
    await sleep(3200);
  }
  eventLeakScore=hits-5;
  const leaked=hits>5;
  document.getElementById('s-leak').textContent=eventLeakScore;
  document.getElementById('s-leak').className=leaked?'err':'ok';
  log('T1: fired='+hits+'/5 expected. Leak='+(leaked?'YES - BUG':'NO - OK'),leaked?'err':'ok');
}

async function testDoubleDamage(){
  log('T2: Double-damage test...','ok');
  const ctrl=await pool.spawn('big_orc',{position:{x:0,y:0,z:5}});
  if(!ctrl){log('Spawn failed','err');return;}
  let hits=0;
  ctrl.anim&&ctrl.anim._internalEvents.on('onAttackHit',()=>hits++);
  ctrl.setTarget(playerNode);
  ctrl._beginAttack&&ctrl._beginAttack();
  ctrl.anim&&ctrl.anim.pause();
  ctrl.anim&&ctrl.anim.restart();
  ctrl.anim&&ctrl.anim.advanceEvents(2.0);
  await sleep(400);
  const doubled=hits>1;
  doubleDamageCount+=doubled?1:0;
  document.getElementById('s-double').textContent=doubleDamageCount;
  document.getElementById('s-double').className=doubleDamageCount>0?'err':'ok';
  log('T2: hits='+hits+' → '+(doubled?'DOUBLE FIRE - BUG':'SINGLE FIRE - OK'),doubled?'err':'ok');
  ctrl.takeDamage(99999);
}

async function testDeathRace(){
  log('T3: Death+recycle race...','ok');
  const ctrl=await pool.spawn('big_orc',{position:{x:3,y:0,z:3}});
  if(!ctrl){log('Spawn failed','err');return;}
  const uid=ctrl.uid;
  ctrl.takeDamage(99999);
  await sleep(100);
  pool.update(0,{x:0,y:0,z:0});
  await sleep(3500);
  const leaked=pool.active.has(uid);
  log('T3: uid in active post-3.5s = '+(leaked?'YES - LEAK':'NO - OK'),leaked?'err':'ok');
}

async function testSpawnRace(){
  log('T4: Async spawn race...','ok');
  spawnMgr.addZone({id:'rt',center:{x:5,z:5},spawnRadius:20,maxActive:3,density:1,respawnDelay:999,enemies:[{id:'big_orc',weight:1}]});
  camera.target.set(500,0,500);
  await sleep(2000);
  const leaked=Array.from(pool.active.values()).some(c=>c.enemyId==='big_orc'&&!spawnMgr.zones.has('rt'));
  spawnMgr.removeZone('rt');
  camera.target.set(0,0,0);
  log('T4: enemy after zone removed = '+(leaked?'RACE BUG':'OK'),leaked?'err':'ok');
}

async function testCacheUnload(){
  log('T5: Cache+pool coordination...','ok');
  const ctrl=await pool.spawn('big_orc',{position:{x:2,y:0,z:2}});
  if(ctrl){ctrl.takeDamage(99999);await sleep(3200);}
  const pre=(pool.inactive.get('big_orc')||[]).length;
  log('Pre-unload inactive: '+pre,'ok');
  EnemyLoader.unload('big_orc',pool);
  const post=(pool.inactive.get('big_orc')||[]).length;
  log('T5: post-unload inactive='+post+' '+(post===0?'OK - CLEAN':'BUG - LEAK'),post===0?'ok':'err');
}

async function testFlyingY(){
  log('T6: Flying Y anchor...','ok');
  const ctrl=await pool.spawn('flying_armabee',{position:{x:0,y:0,z:8}});
  if(!ctrl){log('flying_armabee not found','warn');return;}
  const expY=(ctrl._spawnY||0)+(ctrl.info.groundOffset||0);
  ctrl.setTarget(playerNode);
  for(let i=0;i<10;i++)ctrl.update(0.016);
  const ay=ctrl.rootNode.position.y;
  const drift=Math.abs(ay-expY);
  log('T6: expY='+expY.toFixed(2)+' actual='+ay.toFixed(2)+' drift='+drift.toFixed(3)+' '+(drift<0.5?'OK':'DRIFT BUG'),drift<0.5?'ok':'warn');
  ctrl.takeDamage(99999);
}

async function scanRegistry(){
  log('Scanning registry...','ok');
  const all=EnemyRegistry.getAll();
  log('Registry: '+all.length+' entries','ok');
  let ok=0,miss=0;
  for(const info of all){
    try{
      const r=await fetch(info.modelPath,{method:'HEAD'});
      if(r.ok)ok++;
      else{miss++;log('MISS: '+info.id+' -> '+info.modelPath,'err');}
    }catch(e){miss++;log('ERR: '+info.id,'err');}
  }
  log('Scan done: OK='+ok+' MISSING='+miss+'/'+all.length,miss>0?'warn':'ok');
}
</script>
</body>
</html>
