name: Cleanup legacy world assets

on:
  push:
    paths:
      - '.github/workflows/cleanup-legacy-world-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove legacy town and flora packs
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch "assets/THON TRAN" "assets/environment/flora"
          git rm --ignore-unmatch ".github/workflows/cleanup-legacy-world-assets.yml"
          if git diff --cached --quiet; then
            echo "Nothing to remove."
            exit 0
          fi
          git commit -m "Remove legacy town and flora asset packs"
          git push origin HEAD:main
