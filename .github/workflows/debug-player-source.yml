name: Debug player source grids
on:
  push:
    paths:
      - ".github/workflows/debug-player-source.yml"
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python -m pip install pillow
      - run: python scripts/debug_player_source.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/player/debug_*.webp
          git commit -m "Add temporary player source previews"
          git pull --rebase origin main
          git push
