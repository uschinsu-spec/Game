name: Repair player transparency with rembg

on:
  push:
    paths:
      - ".github/workflows/repair-player-rembg.yml"

permissions:
  contents: write

jobs:
  repair-player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install segmentation dependencies
        run: python -m pip install --disable-pip-version-check "rembg[cpu]" pillow numpy opencv-python-headless

      - name: Rebuild player frames from original sheets
        run: python scripts/repair_player_with_rembg.py

      - name: Verify final asset counts
        run: |
          test "$(find assets/characters/player -maxdepth 1 -name 'player_run_??.webp' | wc -l)" -eq 25
          test "$(find assets/characters/player -maxdepth 1 -name 'player_attack_??.webp' | wc -l)" -eq 20

      - name: Commit repaired player
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Remove checkerboard and repair player frames"
          git pull --rebase origin main
          git push
