name: Build player run/attack assets

on:
  push:
    paths:
      - ".github/workflows/build-player-assets.yml"

permissions:
  contents: write

jobs:
  build-player-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Cut and convert player frames
        run: python scripts/build_player_assets.py

      - name: Verify generated assets
        run: |
          test "$(find assets/characters/player -maxdepth 1 -name 'player_run_??.webp' | wc -l)" -eq 25
          test "$(find assets/characters/player -maxdepth 1 -name 'player_attack_??.webp' | wc -l)" -eq 20
          test ! -e assets/characters/player/player_idle.webp
          test ! -e assets/characters/player/player_fly.webp
          test ! -e assets/characters/player/player_fly_attack.webp
          test ! -e assets/characters/player/player_run.webp
          test ! -e assets/characters/player/player_attack.webp
          test ! -e assets/characters/player/IMG_7539.png
          test ! -e assets/characters/player/IMG_7540.png

      - name: Commit final player assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Replace player with 25 run and 20 attack frames"
          git pull --rebase origin main
          git push
