name: Exact player checkerboard repair
# retry after fixing color-distance overflow
on:
  push:
    paths:
      - ".github/workflows/repair-player-colorkey.yml"
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - run: python scripts/repair_player_colorkey.py
      - run: |
          test "$(find assets/characters/player -maxdepth 1 -name 'player_run_??.webp' | wc -l)" -eq 25
          test "$(find assets/characters/player -maxdepth 1 -name 'player_attack_??.webp' | wc -l)" -eq 20
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Clean player checkerboard background"
          git pull --rebase origin main
          git push
