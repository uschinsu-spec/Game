<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanh Vân 3D - Trình Thử Nghiệm 50 Quái Vật (Enemies 3D)</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #0f172a; color: #f8fafc; overflow: hidden; display: flex; height: 100vh; }
    
    /* LEFT SIDEBAR */
    #sidebar { width: 320px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; }
    .sidebar-header { padding: 16px; border-bottom: 1px solid #334155; background: #0f172a; }
    .sidebar-header h2 { font-size: 16px; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .sidebar-header small { color: #94a3b8; font-size: 11px; }

    .cat-tabs { display: flex; padding: 8px 12px; gap: 6px; background: #1e293b; border-bottom: 1px solid #334155; }
    .cat-btn { flex: 1; padding: 6px 4px; font-size: 11px; background: #334155; color: #cbd5e1; border: none; border-radius: 4px; cursor: pointer; }
    .cat-btn.active { background: #0284c7; color: #fff; font-weight: bold; }

    .enemy-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .enemy-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; cursor: pointer; transition: all 0.15s; }
    .enemy-item:hover { border-color: #38bdf8; background: #1e293b; }
    .enemy-item.active { border-color: #38bdf8; background: #0369a1; }
    .enemy-icon { font-size: 20px; }
    .enemy-details { flex: 1; }
    .enemy-name { font-size: 13px; font-weight: 600; color: #f1f5f9; }
    .enemy-sub { font-size: 10px; color: #94a3b8; }

    /* VIEWPORT */
    #mainViewport { flex: 1; position: relative; }
    #renderCanvas { width: 100%; height: 100%; display: block; outline: none; }

    /* FLOATING CONTROLS */
    .viewport-overlay { position: absolute; top: 16px; left: 16px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); padding: 14px 18px; border-radius: 8px; border: 1px solid #334155; }
    .viewport-overlay h3 { font-size: 15px; color: #38bdf8; margin-bottom: 4px; }
    .viewport-overlay p { font-size: 12px; color: #cbd5e1; }

    .action-panel { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); padding: 12px 20px; border-radius: 12px; border: 1px solid #38bdf8; display: flex; gap: 10px; align-items: center; }
    .action-btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
    .btn-attack { background: #dc2626; color: white; }
    .btn-attack:hover { background: #b91c1c; transform: scale(1.05); }
    .btn-hit { background: #ea580c; color: white; }
    .btn-hit:hover { background: #c2410c; transform: scale(1.05); }
    .btn-walk { background: #0284c7; color: white; }
    .btn-walk:hover { background: #0369a1; transform: scale(1.05); }
    .btn-idle { background: #10b981; color: white; }
    .btn-idle:hover { background: #059669; transform: scale(1.05); }
    .btn-spawn-multi { background: #8b5cf6; color: white; }
    .btn-spawn-multi:hover { background: #7c3aed; transform: scale(1.05); }
  </style>
</head>
<body>
  <!-- LEFT SIDEBAR: ENEMY SELECTOR -->
  <div id="sidebar">
    <div class="sidebar-header">
      <h2>👾 50 MẪU QUÁI VẬT 3D</h2>
      <small>Thanh Vân 3D Game Engine (Standard GLB + Skeletons)</small>
    </div>
    <div class="cat-tabs">
      <button class="cat-btn active" data-cat="all">Tất Cả (50)</button>
      <button class="cat-btn" data-cat="big">Quái Lớn (16)</button>
      <button class="cat-btn" data-cat="blob">Blob (17)</button>
      <button class="cat-btn" data-cat="flying">Bay / Rồng (17)</button>
    </div>
    <div id="enemyList" class="enemy-list"></div>
  </div>

  <!-- 3D VIEWPORT -->
  <div id="mainViewport">
    <canvas id="renderCanvas"></canvas>

    <div class="viewport-overlay">
      <h3 id="currentEnemyTitle">Đang nạp...</h3>
      <p id="currentEnemyStats">HP: 1000 | Sát thương: 80 | Tốc độ: 2.2</p>
      <div id="currentEnemyTier" style="font-size:11px;color:#38bdf8;margin-top:4px;font-weight:bold;">🟢 Cấp 1 (Gần: 60 FPS + Shadow)</div>
      <small style="color:#94a3b8;display:block;margin-top:4px;">Xoay chuột để nhìn 360° • Cuộn chuột để phóng to/thu nhỏ</small>
    </div>

    <!-- ACTION CONTROLS -->
    <div class="action-panel">
      <button id="btnIdle" class="action-btn btn-idle">🧍 Đứng Thở (Idle)</button>
      <button id="btnWalk" class="action-btn btn-walk">🚶 Di Chuyển (Walk)</button>
      <button id="btnAttack" class="action-btn btn-attack">⚔️ Tấn Công (Attack)</button>
      <button id="btnTakeDamage" class="action-btn btn-hit">💥 Đánh Trúng (-150 HP)</button>
      <button id="btnSpawnHorde" class="action-btn btn-spawn-multi">👥 Tạo Bầy Đàn (x10 Con)</button>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="./assets/enemies/enemy-registry.js"></script>
  <script src="./assets/enemies/enemy-animation.js"></script>
  <script src="./assets/enemies/enemy-controller.js"></script>
  <script src="./assets/enemies/enemy-loader.js"></script>

  <script>
    const canvas = document.getElementById('renderCanvas');
    const engine = new BABYLON.Engine(canvas, true);
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.08, 0.12, 0.20, 1.0);

    // Camera & Light
    const camera = new BABYLON.ArcRotateCamera('Cam', Math.PI / 2, 1.15, 6.5, new BABYLON.Vector3(0, 1.0, 0), scene);
    camera.attachControl(canvas, true);
    camera.lowerRadiusLimit = 2;
    camera.upperRadiusLimit = 25;

    const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0, 1, 0), scene);
    hemi.intensity = 1.35;
    hemi.diffuse = new BABYLON.Color3(1, 0.98, 0.92);

    const dirLight = new BABYLON.DirectionalLight('dir', new BABYLON.Vector3(-0.5, -1, 0.5), scene);
    dirLight.intensity = 1.1;

    // Ground Platform
    const ground = BABYLON.MeshBuilder.CreateGround('Ground', { width: 25, height: 25 }, scene);
    const gMat = new BABYLON.StandardMaterial('gMat', scene);
    gMat.diffuseColor = new BABYLON.Color3(0.15, 0.22, 0.35);
    ground.material = gMat;

    let currentEnemy = null;
    let horde = [];
    let selectedId = 'big_demon';
    let currentCat = 'all';

    async function showEnemy(id) {
      // Clear old
      if (currentEnemy) currentEnemy.dispose();
      for (const h of horde) h.dispose();
      horde = [];

      selectedId = id;
      const info = EnemyRegistry.get(id);
      if (!info) return;

      document.getElementById('currentEnemyTitle').textContent = `${info.icon || '👾'} ${info.name} (${info.codeName})`;
      document.getElementById('currentEnemyStats').textContent = `HP: ${info.hp} | Sát thương: ${info.damage} | Tốc độ: ${info.speed}`;

      document.querySelectorAll('.enemy-item').forEach(el => {
        el.classList.toggle('active', el.dataset.id === id);
      });

      currentEnemy = await EnemyLoader.spawn(id, scene, { position: { x: 0, y: 0, z: 0 } });
    }

    function renderList(cat) {
      const listEl = document.getElementById('enemyList');
      listEl.innerHTML = '';
      const enemies = EnemyRegistry.getByCategory(cat);

      enemies.forEach(e => {
        const item = document.createElement('div');
        item.className = 'enemy-item' + (e.id === selectedId ? ' active' : '');
        item.dataset.id = e.id;
        item.innerHTML = `
          <div class="enemy-icon">${e.icon || '👾'}</div>
          <div class="enemy-details">
            <div class="enemy-name">${e.name}</div>
            <div class="enemy-sub">${e.codeName} • ${e.cat.toUpperCase()} • HP: ${e.hp}</div>
          </div>
        `;
        item.onclick = () => showEnemy(e.id);
        listEl.appendChild(item);
      });
    }

    // Category Tabs
    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCat = btn.dataset.cat;
        renderList(currentCat);
      };
    });

    // Action buttons
    document.getElementById('btnIdle').onclick = () => {
      if (currentEnemy) currentEnemy.play('Idle', true);
    };

    document.getElementById('btnWalk').onclick = () => {
      if (currentEnemy) currentEnemy.play('Walk', true);
    };

    document.getElementById('btnAttack').onclick = () => {
      if (currentEnemy) {
        currentEnemy.play('Attack', false, 1.0, () => currentEnemy.play('Idle', true));
      }
    };

    document.getElementById('btnTakeDamage').onclick = () => {
      if (currentEnemy) {
        currentEnemy.takeDamage(150 + Math.floor(Math.random() * 50), Math.random() > 0.5);
      }
    };

    document.getElementById('btnSpawnHorde').onclick = async () => {
      for (const h of horde) h.dispose();
      horde = [];
      for (let i = 0; i < 10; i++) {
        const angle = (i / 10) * Math.PI * 2;
        const radius = 4.5 + Math.random() * 2.0;
        const pos = {
          x: Math.cos(angle) * radius,
          y: 0,
          z: Math.sin(angle) * radius
        };
        const spawn = await EnemyLoader.spawn(selectedId, scene, { position: pos, rotationY: angle + Math.PI });
        if (spawn) horde.push(spawn);
      }
    };

    // Initialize
    renderList('all');
    showEnemy('big_demon');

    let lastTime = performance.now();
    engine.runRenderLoop(() => {
      const now = performance.now();
      const dt = Math.min(0.1, (now - lastTime) / 1000);
      lastTime = now;

      if (currentEnemy && !currentEnemy.isDead) {
        currentEnemy.update(dt);
        const tierBadge = currentEnemy.performanceTier === 1 ? '🟢 Cấp 1 (Gần: 60 FPS + Shadow)' : (currentEnemy.performanceTier === 2 ? '🟡 Cấp 2 (Trung bình: Tiết kiệm AI)' : '🔴 Cấp 3 (Xa: Freeze Animation)');
        const tierEl = document.getElementById('currentEnemyTier');
        if (tierEl) tierEl.textContent = tierBadge;
      }
      for (const h of horde) {
        if (!h.isDead) h.update(dt);
      }

      scene.render();
    });

    window.addEventListener('resize', () => engine.resize());
  </script>
</body>
</html>
