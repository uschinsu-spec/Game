  <script>document.querySelectorAll('[data-ui-icon]').forEach(el=>{const p=window.UI_ICONS&&window.UI_ICONS[el.dataset.uiIcon];if(p)el.src=p;});const VERSION_KEY='tu-tien-build-version';async function checkForGameUpdate(){try{const r=await fetch('./version.json?t='+Date.now(),{cache:'no-store'});const d=await r.json();const v=String(d.version||'');const l=localStorage.getItem(VERSION_KEY);if(!l)localStorage.setItem(VERSION_KEY,v);else if(v&&l!==v){localStorage.setItem(VERSION_KEY,v);location.reload();}}catch(_){}}checkForGameUpdate();if('serviceWorker'in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('./service-worker.js?v=20260915-combat-v4',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});});}</script>
