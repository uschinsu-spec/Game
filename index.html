<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/><meta name="theme-color" content="#101722"/><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/><meta http-equiv="Pragma" content="no-cache"/><meta http-equiv="Expires" content="0"/><title>Tu Tiên 3D Mobile Prototype</title><link rel="stylesheet" href="./style.css?v=20260914-8"/><script src="https://cdn.babylonjs.com/babylon.js"></script></head><body><canvas id="renderCanvas"></canvas><div id="hud"><section class="status-panel glass"><div class="portrait">仙</div><div class="status-copy"><div class="name-row"><strong>Linh Phong</strong><span>Lv.1</span></div><div class="bar hp"><i style="width:100%"></i><b>100 / 100</b></div><div class="bar mp"><i style="width:100%"></i><b>100 / 100</b></div></div></section><section class="quest glass"><strong>[Chính] Nhập Môn Tu Tiên</strong><span>• Tiến vào Thanh Vân Tiên Môn</span><span>• Khám phá linh sơn và tiên các</span></section><section class="minimap glass"><div class="mini-ring"><span>▲</span></div><b>Thanh Vân Tiên Vực</b><small id="coords">X: 0.0 Z: 0.0</small></section><div id="joystick" class="joystick"><div id="stick"></div></div><section class="skills"><button class="skill" data-skill="1">⚡<small>Skill 1</small></button><button class="skill" data-skill="2">✦<small>Skill 2</small></button><button id="attack" class="skill attack">⚔<small>Đánh</small></button><button id="jump" class="skill">↑<small>Nhảy</small></button></section><section class="quickbar glass"><button data-action="weapon">Đổi vũ khí</button><button data-action="armor">Đổi giáp</button><button data-action="mount">Cưỡi ngựa</button><button data-action="beast">Linh thú</button></section><section class="debug glass"><b id="animState">Idle</b><span id="equipmentState">Kiếm • Thanh Vân giáp</span></section></div><script>const VERSION_KEY='tu-tien-build-version';async function checkForGameUpdate(){try{const response=await fetch('./version.json?t='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache'}});if(!response.ok)return;const data=await response.json();const remoteVersion=String(data.version||'');if(!remoteVersion)return;const localVersion=localStorage.getItem(VERSION_KEY);if(!localVersion){localStorage.setItem(VERSION_KEY,remoteVersion);return}if(localVersion!==remoteVersion){localStorage.setItem(VERSION_KEY,remoteVersion);const url=new URL(location.href);url.searchParams.set('v',remoteVersion);location.replace(url.toString())}}catch(_){}}checkForGameUpdate();document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkForGameUpdate()});window.addEventListener('pageshow',checkForGameUpdate);setInterval(checkForGameUpdate,60000);if('serviceWorker'in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./service-worker.js',{updateViaCache:'none'}).then(reg=>reg.update()).catch(()=>{})})}</script><script src="./game.js?v=20260914-8"></script><script src="./camera-controls.js?v=20260914-8"></script></body></html>
