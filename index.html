<script>(function(){const b=document.getElementById('bootScreen'),m=document.getElementById('bootMsg');function fail(s){m.textContent=s;m.style.color='#ffb0a0'}function load(src,timeout=15000){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.async=false;let done=false;const t=setTimeout(()=>{if(!done){done=true;s.remove();no(new Error('timeout '+src))}},timeout);s.onload=()=>{if(!done){done=true;clearTimeout(t);ok()}};s.onerror=()=>{if(!done){done=true;clearTimeout(t);no(new Error('load '+src))}};document.body.appendChild(s)})}async function boot(){try{m.textContent='Đang tải Babylon.js…';try{await load('https://cdn.babylonjs.com/babylon.js',12000)}catch(e){await load('https://cdn.jsdelivr.net/npm/babylonjs@7.54.3/babylon.min.js',12000)}if(!window.BABYLON)throw new Error('Babylon.js không tải được');try{await load('https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js',10000)}catch(e){await load('https://cdn.jsdelivr.net/npm/babylonjs-loaders@7.54.3/babylonjs.loaders.min.js',10000)}const files=['./assets/ui/ui-icons.js','./game.js','./assets/environment/terrain/tex_01_Grass_Lush.js','./assets/environment/world/enhanced-world.js','./assets/characters/rigged-player.js','./assets/characters/player-animation-pro.js','./assets/characters/player-upperbody-animation.js','./assets/characters/player-combat-facing.js','./assets/enemies/enemy-registry.js','./assets/enemies/enemy-animation.js','./assets/enemies/enemy-loader.js','./assets/enemies/ultimate-monsters.js','./idle-adventure.js','./skill-vfx.js','./progression-systems.js','./mobile-runtime.js','./mobile-controls-fix.js'];for(const f of files){m.textContent='Đang tải '+f.split('/').pop()+'…';await load(f+'?v=20260915-bootfix-v5',15000)}document.querySelectorAll('[data-ui-icon]').forEach(el=>{const p=window.UI_ICONS&&window.UI_ICONS[el.dataset.uiIcon];if(p)el.src=p});b.style.display='none'}catch(e){console.error(e);fail('Không tải được game: '+e.message+' — chạm tải lại trang.');b.onclick=()=>location.reload()}}boot();if('serviceWorker'in navigator){navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.unregister()))).catch(()=>{});caches&&caches.keys&&caches.keys().then(ns=>Promise.all(ns.map(n=>caches.delete(n)))).catch(()=>{})}})();</script></body></html>
