<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanh Vân 3D - Trình Thử Nghiệm 176 Chi Tiết Thôn Trấn (Medieval Village)</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #0f172a; color: #f8fafc; overflow: hidden; display: flex; height: 100vh; }
    
    /* LEFT SIDEBAR */
    #sidebar { width: 340px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; }
    .sidebar-header { padding: 14px 16px; border-bottom: 1px solid #334155; background: #0f172a; }
    .sidebar-header h2 { font-size: 15px; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .sidebar-header small { color: #94a3b8; font-size: 11px; }

    .search-box { padding: 8px 12px; background: #0f172a; border-bottom: 1px solid #334155; }
    .search-box input { width: 100%; padding: 6px 10px; background: #1e293b; border: 1px solid #475569; border-radius: 4px; color: #fff; font-size: 12px; outline: none; }
    .search-box input:focus { border-color: #38bdf8; }

    .cat-tabs { display: flex; flex-wrap: wrap; padding: 6px; gap: 4px; background: #1e293b; border-bottom: 1px solid #334155; }
    .cat-btn { padding: 4px 8px; font-size: 10.5px; background: #334155; color: #cbd5e1; border: none; border-radius: 4px; cursor: pointer; }
    .cat-btn.active { background: #0284c7; color: #fff; font-weight: bold; }

    .asset-list { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
    .asset-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; cursor: pointer; transition: all 0.15s; }
    .asset-item:hover { border-color: #38bdf8; background: #1e293b; }
    .asset-item.active { border-color: #38bdf8; background: #0369a1; }
    .asset-icon { font-size: 18px; }
    .asset-details { flex: 1; min-width: 0; }
    .asset-name { font-size: 12px; font-weight: 600; color: #f1f5f9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .asset-sub { font-size: 9.5px; color: #94a3b8; }

    /* VIEWPORT */
    #mainViewport { flex: 1; position: relative; }
    #renderCanvas { width: 100%; height: 100%; display: block; outline: none; }

    /* FLOATING STATS OVERLAY */
    .viewport-overlay { position: absolute; top: 16px; left: 16px; background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(8px); padding: 14px 18px; border-radius: 8px; border: 1px solid #334155; max-width: 380px; }
    .viewport-overlay h3 { font-size: 15px; color: #38bdf8; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .viewport-overlay p { font-size: 12px; color: #cbd5e1; line-height: 1.4; }

    .build-demo-panel { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(8px); padding: 10px 18px; border-radius: 12px; border: 1px solid #38bdf8; display: flex; gap: 10px; align-items: center; }
    .action-btn { padding: 8px 14px; border: none; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
    .btn-house { background: #0284c7; color: white; }
    .btn-house:hover { background: #0369a1; transform: scale(1.05); }
    .btn-single { background: #10b981; color: white; }
    .btn-single:hover { background: #059669; transform: scale(1.05); }
  </style>
</head>
<body>
  <!-- LEFT SIDEBAR -->
  <div id="sidebar">
    <div class="sidebar-header">
      <h2>🏛️ 176 CHI TIẾT THÔN TRẤN</h2>
      <small>Thanh Vân 3D - Standalone Modular Medieval Village</small>
    </div>
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="🔍 Tìm kiếm chi tiết nhà..."/>
    </div>
    <div class="cat-tabs" id="catTabs">
      <button class="cat-btn active" data-cat="all">Tất Cả (176)</button>
      <button class="cat-btn" data-cat="walls">Tường (20)</button>
      <button class="cat-btn" data-cat="roofs">Mái Ngói (35)</button>
      <button class="cat-btn" data-cat="doors">Cửa Đi (12)</button>
      <button class="cat-btn" data-cat="windows">Cửa Sổ (18)</button>
      <button class="cat-btn" data-cat="stairs">Cầu Thang (17)</button>
      <button class="cat-btn" data-cat="overhangs">Mái Hiên (20)</button>
      <button class="cat-btn" data-cat="props">Đạo Cụ (18)</button>
      <button class="cat-btn" data-cat="floors">Sàn Gỗ (17)</button>
      <button class="cat-btn" data-cat="corners">Cột Góc (12)</button>
      <button class="cat-btn" data-cat="balconies">Ban Công (4)</button>
    </div>
    <div id="assetList" class="asset-list"></div>
  </div>

  <!-- 3D VIEWPORT -->
  <div id="mainViewport">
    <canvas id="renderCanvas"></canvas>

    <div class="viewport-overlay">
      <h3 id="currentTitle">Đang nạp dữ liệu...</h3>
      <p id="currentStats">Kích thước: -- | Đỉnh: -- | Mặt: --</p>
      <small style="color:#94a3b8;display:block;margin-top:6px;">🖱️ Chuột trái: Xoay 360° • Cuộn chuột: Phóng to/Thu nhỏ • Chuột phải: Pan</small>
    </div>

    <div class="build-demo-panel">
      <button id="btnBuildHouse" class="action-btn btn-house">🏘️ Ghép Thử Ngôi Nhà Mẫu (Demo House)</button>
      <button id="btnResetView" class="action-btn btn-single">🔍 Xem Riêng Lẻ</button>
    </div>
  </div>

  <!-- LOADER SCRIPT -->
  <script src="./assets/THON TRAN/thon_tran_loader.js"></script>

  <script>
    const canvas = document.getElementById('renderCanvas');
    if (typeof BABYLON !== 'undefined' && BABYLON.Texture) {
      BABYLON.Texture.DEFAULT_ANISOTROPIC_FILTERING_LEVEL = 4;
    }
    const engine = new BABYLON.Engine(canvas, true, { adaptToDeviceRatio: true, antialias: true, powerPreference: 'high-performance' });
    const scene = new BABYLON.Scene(engine);
    scene.clearColor = new BABYLON.Color4(0.08, 0.12, 0.20, 1.0);
    if (scene.imageProcessingConfiguration) {
      scene.imageProcessingConfiguration.toneMappingEnabled = true;
      scene.imageProcessingConfiguration.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
      scene.imageProcessingConfiguration.exposure = 1.08;
      scene.imageProcessingConfiguration.contrast = 1.12;
    }

    // Orbit Camera
    const camera = new BABYLON.ArcRotateCamera('Cam', Math.PI / 2, 1.15, 8.0, new BABYLON.Vector3(0, 1.5, 0), scene);
    camera.attachControl(canvas, true);
    camera.lowerRadiusLimit = 1.5;
    camera.upperRadiusLimit = 40;

    // Lights
    const hemi = new BABYLON.HemisphericLight('hemi', new BABYLON.Vector3(0, 1, 0), scene);
    hemi.intensity = 1.25;
    hemi.diffuse = new BABYLON.Color3(1, 0.98, 0.92);

    const sun = new BABYLON.DirectionalLight('sun', new BABYLON.Vector3(-0.5, -1, 0.5), scene);
    sun.intensity = 1.1;

    // Ground Platform
    const ground = BABYLON.MeshBuilder.CreateGround('Ground', { width: 30, height: 30 }, scene);
    const gMat = new BABYLON.StandardMaterial('gMat', scene);
    gMat.diffuseColor = new BABYLON.Color3(0.18, 0.24, 0.32);
    ground.material = gMat;

    let manifestData = {};
    let currentObjectNode = null;
    let selectedId = 'Roof_Tower_RoundTiles';
    let currentCat = 'all';

    async function loadManifest() {
      try {
        const res = await fetch('./assets/THON TRAN/thon_tran_manifest.json');
        manifestData = await res.json();
        renderList();
        showAsset('Roof_Tower_RoundTiles');
      } catch (e) {
        console.error('Failed to load manifest:', e);
      }
    }

    async function showAsset(id) {
      if (currentObjectNode) currentObjectNode.dispose();

      selectedId = id;
      const item = manifestData[id];
      if (!item) return;

      document.getElementById('currentTitle').textContent = `${item.icon || '🏛️'} ${item.name}`;
      document.getElementById('currentStats').textContent = `Kích thước: ${item.dimensions.x}m x ${item.dimensions.y}m x ${item.dimensions.z}m | Đỉnh: ${item.vertices.toLocaleString()} | Mặt: ${item.triangles.toLocaleString()} (${item.categoryVi})`;

      document.querySelectorAll('.asset-item').forEach(el => {
        el.classList.toggle('active', el.dataset.id === id);
      });

      const api = await ThonTranLoader.loadAsset(id);
      if (api) {
        currentObjectNode = api.createInstance('Preview_' + id, null, scene);
        currentObjectNode.position.set(0, 0.01, 0);
      }
    }

    function renderList() {
      const listEl = document.getElementById('assetList');
      listEl.innerHTML = '';
      const search = (document.getElementById('searchInput').value || '').toLowerCase();

      const filtered = Object.values(manifestData).filter(item => {
        const matchCat = currentCat === 'all' || item.category === currentCat;
        const matchSearch = search === '' || item.name.toLowerCase().includes(search);
        return matchCat && matchSearch;
      });

      filtered.forEach(item => {
        const div = document.createElement('div');
        div.className = 'asset-item' + (item.id === selectedId ? ' active' : '');
        div.dataset.id = item.id;
        div.innerHTML = `
          <div class="asset-icon">${item.icon || '🏛️'}</div>
          <div class="asset-details">
            <div class="asset-name" title="${item.name}">${item.name}</div>
            <div class="asset-sub">${item.categoryVi} • ${item.vertices} vtx</div>
          </div>
        `;
        div.onclick = () => showAsset(item.id);
        listEl.appendChild(div);
      });
    }

    document.getElementById('searchInput').oninput = () => renderList();

    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCat = btn.dataset.cat;
        renderList();
      };
    });

    // Build a demo modular house combining walls, door, windows, and roof
    document.getElementById('btnBuildHouse').onclick = async () => {
      if (currentObjectNode) currentObjectNode.dispose();
      currentObjectNode = new BABYLON.TransformNode('DemoHouseRoot', scene);

      document.getElementById('currentTitle').textContent = '🏘️ Ngôi Nhà Mẫu Thôn Trấn (Modular Village House)';
      document.getElementById('currentStats').textContent = 'Ghép từ 10 chi tiết: Tường vữa, Khung cửa, Cửa gỗ, Cửa sổ, Mái ngói 8x8, Ban công, Ống khói';

      const pieces = [
        { id: 'Wall_Plaster_Door_Round', x: 0, y: 0, z: 2, ry: 0 },
        { id: 'Door_1_Round', x: 0, y: 0, z: 2, ry: 0 },
        { id: 'Wall_Plaster_Window_Wide_Round', x: -2, y: 0, z: 2, ry: 0 },
        { id: 'Wall_Plaster_Straight', x: 2, y: 0, z: 2, ry: 0 },
        { id: 'Wall_Plaster_Straight', x: -3, y: 0, z: 0, ry: Math.PI / 2 },
        { id: 'Wall_Plaster_Straight', x: 3, y: 0, z: 0, ry: -Math.PI / 2 },
        { id: 'Wall_Plaster_Straight', x: 0, y: 0, z: -2, ry: Math.PI },
        { id: 'Roof_RoundTiles_8x8', x: 0, y: 3.5, z: 0, ry: 0 },
        { id: 'Prop_Chimney', x: 1.8, y: 4.8, z: 0.8, ry: 0 },
        { id: 'Prop_Wagon', x: -3.5, y: 0, z: 3.5, ry: 0.6 }
      ];

      for (const p of pieces) {
        const api = await ThonTranLoader.loadAsset(p.id);
        if (api) {
          const inst = api.createInstance('Piece_' + p.id, currentObjectNode, scene);
          inst.position.set(p.x, p.y, p.z);
          inst.rotation.y = p.ry;
        }
      }
    };

    document.getElementById('btnResetView').onclick = () => {
      showAsset(selectedId);
    };

    loadManifest();

    engine.runRenderLoop(() => {
      scene.render();
    });

    window.addEventListener('resize', () => engine.resize());
  </script>
</body>
</html>
